<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Форма коментарів</title>
    <link href="css/style.css.css" rel="stylesheet" />
</head>
<body>

    <h2>Залишити коментар</h2>
    
    <form action="#" method="post" name="comment" id="comment">
        <p>
            <input type="text" name="author" id="author" value="" size="25"/> Ім'я
        </p>
        <p>
            <input type="text" name="email" id="email" value="" size="25"/> Пошта
        </p>
        <p>
            <textarea name="comment" id="comment-text" cols="48" rows="8"></textarea>
        </p>
        <p>
            <input type="submit" name="submit" id="submit" value="Надіслати"/>
        </p>
    </form>

</body>
</html>
